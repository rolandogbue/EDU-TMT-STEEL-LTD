# Cloudflare Workers deployment config.
# Build first with `npm run build`, then deploy with `npx wrangler deploy`.
# Full step-by-step guide: docs/DEPLOYMENT.md
name = "edu-tmt-steel"
main = "./dist/server/index.mjs"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]
no_bundle = true

[assets]
binding = "ASSETS"
directory = "./dist/client"

# The server bundle is plain ESM — tell Wrangler not to treat it as a service-worker script.
rules = [
  { type = "ESModule", globs = ["**/*.mjs", "**/*.js"] },
]

# Server-side env vars (non-secret publishable values can also live under [vars]).
# Secrets are set with: npx wrangler secret put SUPABASE_URL
#                       npx wrangler secret put SUPABASE_PUBLISHABLE_KEY
# [vars]
# SUPABASE_URL = "https://your-project.supabase.co"
# SUPABASE_PUBLISHABLE_KEY = "your-publishable-key"
